---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: governed-agent-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agents.governed.io
  resources:
  - agentruns
  - agents
  - tenantpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.governed.io
  resources:
  - agentruns/finalizers
  - agents/finalizers
  - tenantpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - agents.governed.io
  resources:
  - agentruns/status
  - agents/status
  - tenantpolicies/status
  verbs:
  - get
  - patch
  - update
