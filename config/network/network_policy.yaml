apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: governed-agent-operator-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: governed-agent-operator
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-control-api
      ports:
        - protocol: TCP
          port: 8000

