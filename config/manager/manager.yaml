apiVersion: v1
kind: ConfigMap
metadata:
  name: governed-agent-operator-config
data:
  apiUrl: http://agent-control-api:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governed-agent-operator
  labels:
    app.kubernetes.io/name: governed-agent-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: governed-agent-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governed-agent-operator
        app.kubernetes.io/part-of: governed-agent-control
    spec:
      serviceAccountName: governed-agent-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/6riemann9/governed-agent-control-plane:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: GOVERNED_API_URL
              valueFrom:
                configMapKeyRef:
                  name: governed-agent-operator-config
                  key: apiUrl
            - name: GOVERNED_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: governed-agent-operator-credentials
                  key: token
                  optional: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

