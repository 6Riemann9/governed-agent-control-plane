apiVersion: v1
kind: Service
metadata:
  name: governed-postgres
  labels:
    app.kubernetes.io/name: governed-postgres
    app.kubernetes.io/part-of: governed-agent-control
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: governed-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: governed-postgres
  labels:
    app.kubernetes.io/name: governed-postgres
    app.kubernetes.io/part-of: governed-agent-control
spec:
  serviceName: governed-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: governed-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governed-postgres
        app.kubernetes.io/part-of: governed-agent-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # The PVC mount root is owned by the kubelet. Initialising in a
            # child directory lets the non-root postgres process own PGDATA.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: governed
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: governed-database
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: governed-database
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "governed", "-d", "governed"]
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "governed", "-d", "governed"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
