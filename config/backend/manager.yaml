apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-control-api
  labels:
    app.kubernetes.io/name: agent-control-api
    app.kubernetes.io/part-of: governed-agent-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-control-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-control-api
        app.kubernetes.io/part-of: governed-agent-control
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: governed-agent-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: RUN_STORE
              value: postgres
            - name: EXECUTION_MODE
              value: mock
            - name: LLM_BASE_URL
              value: https://xindu.xyz/v1
            - name: LLM_MODEL
              value: deepseek-v4-flash
            - name: LLM_MAX_TOKENS
              value: "512"
            - name: LLM_TIMEOUT_SECONDS
              value: "45"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: governed-llm
                  key: api-key
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: governed-database
                  key: url
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: agent-control-api
  labels:
    app.kubernetes.io/name: agent-control-api
spec:
  selector:
    app.kubernetes.io/name: agent-control-api
  ports:
    - name: http
      port: 8000
      targetPort: http
