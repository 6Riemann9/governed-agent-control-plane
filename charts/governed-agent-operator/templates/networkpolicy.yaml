{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "governed-agent-operator.fullname" . }}-default-deny
  labels:
    {{- include "governed-agent-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "governed-agent-operator.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsNamespace | quote }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- if .Values.networkPolicy.backend.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.backend.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.backend.selector | nindent 14 }}
        {{- else }}
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.backend.selector | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.backend.port }}
{{- end }}

