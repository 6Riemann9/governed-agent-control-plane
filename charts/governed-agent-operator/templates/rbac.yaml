{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "governed-agent-operator.fullname" . }}
  labels:
    {{- include "governed-agent-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.governed.io"]
    resources: ["agentruns", "agents", "tenantpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agents.governed.io"]
    resources: ["agentruns/finalizers", "agents/finalizers", "tenantpolicies/finalizers"]
    verbs: ["update"]
  - apiGroups: ["agents.governed.io"]
    resources: ["agentruns/status", "agents/status", "tenantpolicies/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "governed-agent-operator.fullname" . }}
  labels:
    {{- include "governed-agent-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "governed-agent-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "governed-agent-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "governed-agent-operator.fullname" . }}-leader-election
  labels:
    {{- include "governed-agent-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "governed-agent-operator.fullname" . }}-leader-election
  labels:
    {{- include "governed-agent-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "governed-agent-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "governed-agent-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

