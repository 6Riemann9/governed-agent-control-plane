---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: agentruns.agents.governed.io
spec:
  group: agents.governed.io
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    shortNames:
    - eqrun
    singular: agentrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentRun is the Schema for the agentruns API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentRunSpec defines the desired state of an AgentRun.
            properties:
              agentRef:
                description: AgentRef references an Agent by name in the same namespace.
                minLength: 1
                type: string
              cancel:
                description: Cancel requests cancellation of a running/queued run.
                type: boolean
              dag:
                description: DAG declares the multi-node workflow (optional).
                properties:
                  nodes:
                    description: Nodes lists DAG nodes in dependency order.
                    items:
                      description: DAGNode declares a node in the agent DAG.
                      properties:
                        dependsOn:
                          description: DependsOn lists node names this node depends
                            on.
                          items:
                            type: string
                          type: array
                        name:
                          description: Name is the node name.
                          maxLength: 64
                          minLength: 1
                          type: string
                        prompt:
                          description: Prompt overrides the default prompt for this
                            node.
                          maxLength: 32000
                          type: string
                        role:
                          description: Role is the subagent role for this node.
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 64
                    type: array
                type: object
              idempotencyKey:
                description: IdempotencyKey prevents duplicate executions.
                maxLength: 128
                minLength: 1
                type: string
              input:
                description: Input is submitted to the referenced Agent.
                properties:
                  task:
                    description: Task is the user-visible objective.
                    maxLength: 8000
                    minLength: 1
                    type: string
                required:
                - task
                type: object
              retryPolicy:
                description: RetryPolicy declares retry semantics.
                properties:
                  maxAttempts:
                    default: 1
                    description: MaxAttempts caps execution attempts (1 = no retry).
                    maximum: 5
                    minimum: 1
                    type: integer
                type: object
              ttlSecondsAfterFinished:
                description: TTLSecondsAfterFinished cleans up the run after completion.
                format: int64
                minimum: 0
                type: integer
            required:
            - agentRef
            - input
            type: object
          status:
            description: AgentRunStatus defines the observed state of an AgentRun.
            properties:
              attempts:
                description: Attempts counts execution attempts.
                type: integer
              backendRunId:
                description: BackendRunID is the durable AgentRun identifier in the
                  Governed Agent control plane.
                type: string
              conditions:
                description: Conditions convey detailed status.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              errorCode:
                description: ErrorCode is a stable error code on failure.
                type: string
              finishedAt:
                description: FinishedAt when the run finished.
                format: date-time
                type: string
              message:
                description: Message is a human-readable status message.
                type: string
              nodeStates:
                description: NodeStates captures per-node progress.
                items:
                  description: NodeState captures per-node status.
                  properties:
                    finishedAt:
                      description: FinishedAt when the node finished.
                      format: date-time
                      type: string
                    name:
                      description: Name of the node.
                      type: string
                    phase:
                      description: Phase of this node.
                      enum:
                      - Queued
                      - Running
                      - Succeeded
                      - Failed
                      - Cancelled
                      type: string
                    resultRef:
                      description: ResultRef references the node result in object
                        storage / Postgres.
                      type: string
                    startedAt:
                      description: StartedAt when the node started.
                      format: date-time
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration tracks the last processed generation.
                format: int64
                type: integer
              phase:
                description: Phase is the overall lifecycle phase.
                enum:
                - Queued
                - Running
                - Succeeded
                - Failed
                - Cancelled
                type: string
              resultRef:
                description: ResultRef references the run result in object storage
                  / Postgres.
                type: string
              startedAt:
                description: StartedAt when the run started.
                format: date-time
                type: string
              traceId:
                description: TraceId correlates with Governed Agent trace.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
