name: Publish Governed Agent Control Plane image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Container tag to publish (for example 0.1.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  OPERATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/governed-agent-control-plane
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/governed-agent-api

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          [[ "$tag" =~ ^[0-9][0-9A-Za-z._-]{0,127}$ ]] || {
            echo "Invalid container tag: $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Operator
        id: operator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.OPERATOR_IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.OPERATOR_IMAGE }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build and push API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest Operator build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.OPERATOR_IMAGE }}
          subject-digest: ${{ steps.operator.outputs.digest }}
          push-to-registry: true

      - name: Attest API build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless-sign image digests
        env:
          OPERATOR_DIGEST: ${{ steps.operator.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
        run: |
          cosign sign --yes "${OPERATOR_IMAGE}@${OPERATOR_DIGEST}"
          cosign sign --yes "${API_IMAGE}@${API_DIGEST}"

